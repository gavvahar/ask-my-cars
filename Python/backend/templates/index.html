<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Car Specs & MPG Dashboard</title>
    <script>
      (function () {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/dashboard.css') }}"
    />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  </head>
  <body>
    <div class="layout">
      <aside id="filters" class="sidebar">
        <div id="theme-toggle" class="theme-toggle">
          <button type="button" data-theme="light">Light</button>
          <button type="button" data-theme="dark">Dark</button>
          <button type="button" data-theme="system">System</button>
        </div>
        <h2>Filters</h2>
        <div class="filter-group">
          <label for="filter-makes">Make</label>
          <select id="filter-makes" multiple></select>
        </div>
        <div class="filter-group">
          <label for="filter-year-min">Year</label>
          <input type="range" id="filter-year-min" />
          <input type="range" id="filter-year-max" />
        </div>
        <div class="filter-group">
          <label for="filter-fuel-types">Fuel Type</label>
          <select id="filter-fuel-types" multiple></select>
        </div>
      </aside>

      <main class="content">
        <h1>Car Specs & MPG Dashboard</h1>

        <section id="kpi-row" class="kpi-row">
          <div class="kpi-tile" id="kpi-count">
            <div class="kpi-label">Models</div>
            <div class="kpi-value">—</div>
          </div>
          <div class="kpi-tile" id="kpi-avg-mpg">
            <div class="kpi-label">Avg Highway MPG</div>
            <div class="kpi-value">—</div>
          </div>
          <div class="kpi-tile" id="kpi-avg-hp">
            <div class="kpi-label">Avg Horsepower</div>
            <div class="kpi-value">—</div>
          </div>
        </section>

        <div id="empty-state-message" class="empty-state" style="display: none">
          No cars match these filters.
        </div>

        <div id="dashboard-content">
          <section id="chart-hp-mpg" class="chart-container"></section>
          <section id="chart-mpg-by-style" class="chart-container"></section>
          <section id="chart-hp-msrp" class="chart-container"></section>
          <section class="chart-row">
            <div id="chart-hp-trend" class="chart-container"></div>
            <div id="chart-mpg-trend" class="chart-container"></div>
          </section>

          <section id="leaderboard-section">
            <h2>Top 10 Most Efficient Vehicles</h2>
            <table id="leaderboard-table">
              <thead>
                <tr>
                  <th>Make</th>
                  <th>Model</th>
                  <th>Year</th>
                  <th>Engine HP</th>
                  <th>Highway MPG</th>
                  <th>Efficiency Score</th>
                </tr>
              </thead>
              <tbody id="leaderboard-body"></tbody>
            </table>
          </section>

          <section id="ai-summary-section">
            <h2>AI Summary</h2>
            <button id="generate-summary-btn">Generate summary</button>
            <div id="ai-summary-result"></div>
          </section>
        </div>
      </main>
    </div>

    <script
      type="module"
      src="{{ url_for('static', path='js/dashboard.js') }}"
    ></script>
  </body>
</html>
